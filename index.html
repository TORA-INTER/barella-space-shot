function determine(){
 // Keep the displayed-needle scoring untouched. Only rebalance the distance mapping.
 // Mid-range scores occupy wider bands; the two extreme outcomes require genuinely extreme averages.
 // A single mistimed tap should not overwhelm two strong taps.
 // Weight the two stronger gauges at 42% each, and the weakest at 16%.
 const ranked=[...values].sort((a,b)=>b-a);
 const avg=Math.max(0,Math.min(100,ranked[0]*.42+ranked[1]*.42+ranked[2]*.16));
 const anchors=[
  [0,500],[18,3000],[42,100000],[54,384400000],
  [66,225000000000],[76,1430000000000],
  [84,5900000000000],[89,100000000000000],
  [93,946073047258080000],[100,1e20]
 ];
 for(let i=1;i<anchors.length;i++){
  if(avg<anchors[i][0]){
   const [a,da]=anchors[i-1], [b,db]=anchors[i];
   const t=(avg-a)/(b-a);
   return Math.floor(Math.exp(Math.log(da)+(Math.log(db)-Math.log(da))*t));
  }
 }
 return Math.floor(anchors[anchors.length-1][1]);

function draw(now){
 ctx.clearRect(0,0,W,H);
 if(mode==='flight'){flight(now-flightStart);return;}
 if(mode==='done'){flight(4800);return;}
 const kickElapsed=mode==='kick'?Math.max(0,now-shotStart):0;
 if(restoredScene.complete&&restoredScene.naturalWidth){
  ctx.drawImage(restoredScene,0,90,1581,700,0,0,W,410);
  ctx.fillStyle='#4fac66';ctx.fillRect(0,410,W,70);
  for(let y=423;y<480;y+=17)line([[0,y],[W,y]],'#70c780',1);
 }else{sky();goal();player(0);ball(352,399,18);}
 // The old heading is baked into the stadium image. Mask only that heading area
 // with a soft, readable two-line title; keep the approved illustration intact.
 ctx.save();
 ctx.fillStyle='#328dcb';
 ctx.beginPath();ctx.roundRect(194,8,332,51,18);ctx.fill();
 ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.fillStyle='#fff';ctx.shadowColor='rgba(0,35,75,.55)';ctx.shadowBlur=4;
 ctx.font='700 23px "Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif';
 ctx.fillText('3回のタップで宇宙を開発！',360,34);
 ctx.restore();
 if(mode==='kick'){
  // B experiment: animate only the forward kicking leg. The original scene,
  // framing, goal, face, torso, and planted leg remain untouched.
  // The grass patch hides the baked-in forward boot in a tightly bounded area.
  if(restoredScene.complete&&restoredScene.naturalWidth){
   ctx.drawImage(ctx.canvas,320,371,58,34,177,371,58,34);
  }
  const kickPhase=Math.min(1,kickElapsed/480);
  const legEase=kickPhase* kickPhase*(3-2*kickPhase);
  const kneeX=183+21*legEase,kneeY=375-8*legEase;
  const footX=199+62*legEase,footY=397-40*legEase;
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
  ctx.strokeStyle='#070c16';ctx.lineWidth=19;
  ctx.beginPath();ctx.moveTo(163,365);ctx.lineTo(kneeX,kneeY);ctx.lineTo(footX,footY);ctx.stroke();
  ctx.strokeStyle='#f2c4a2';ctx.lineWidth=12;
  ctx.beginPath();ctx.moveTo(169,368);ctx.lineTo(kneeX,kneeY);ctx.stroke();
  ctx.strokeStyle='#14365e';ctx.lineWidth=12;
  ctx.beginPath();ctx.moveTo(kneeX,kneeY);ctx.lineTo(footX,footY);ctx.stroke();
  ctx.fillStyle='#07101e';ctx.strokeStyle='#060910';ctx.lineWidth=3;
  ctx.beginPath();ctx.ellipse(footX+5,footY,13,7,-.35-legEase*.35,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.restore();
  // Cover ONLY the ball baked into the approved stadium image.
  // Copy an untouched patch of grass from the same rendered frame; no image re-generation.
  // Source (310,334) is clean turf, target (239,334) contains the baked-in ball.
  if(restoredScene.complete&&restoredScene.naturalWidth){
   ctx.drawImage(ctx.canvas,310,334,65,64,239,334,65,64);
  }
  // The launch starts at the pictured ball, and the camera stays on the stadium.
  // A visible ball is tracked before the city flight begins; no instant cut.
  const u=Math.min(1,kickElapsed/760),ease=t=>t*t*(3-2*t);
  const x=270+442*ease(u),y=365-266*Math.pow(u,.83);
  ctx.save();ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=4+7*u;
  ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-24-105*u,y+26+32*u);ctx.quadraticCurveTo(x-38,y+17,x-12,y+6);ctx.stroke();ctx.restore();
  ball(x,y,18+8*u);
  ctx.fillStyle='#fff';ctx.strokeStyle='#193e5e';ctx.lineWidth=4;
  ctx.font='bold 27px system-ui';ctx.textAlign='center';
  ctx.strokeText('バレッラ、シュート！',W/2,62);
  ctx.fillText('バレッラ、シュート！',W/2,62);
 }
}
function updateRecords(){document.getElementById('best-display').textContent=Number.isFinite(best)&&best>0?best.toLocaleString('en-US')+' m':'--';document.getElementById('worst-display').textContent=Number.isFinite(worst)?worst.toLocaleString('en-US')+' m':'--';}
function finish(){mode='done';if(stadiumPreview){stage.textContent=landing;document.getElementById('cosmos-message').style.display=landing==='宇宙そのものを突破！'?'block':'none';score.textContent='演出プレビュー';distance.textContent='';result.style.display='block';document.getElementById('controls').style.display='none';tap.disabled=true;return;}stage.textContent=landing;document.getElementById('cosmos-message').style.display=landing==='宇宙そのものを突破！'?'block':'none';score.textContent=`威力 ${values[0]}点 ／ ミート ${values[1]}点 ／ 精度 ${values[2]}点`;distance.textContent=flightDistance.toLocaleString('en-US')+' m';best=Math.max(best,flightDistance);worst=Math.min(worst,flightDistance);updateRecords();result.style.display='block';document.getElementById('controls').style.display='none';tap.disabled=true;hint.textContent='結果発表！'}function tick(now){if(!last)last=now;let dt=Math.min(now-last,50);last=now;if(mode==='meter'){pos=(pos+dt*(.00077+phase*.00011)*([1,2.20,5.80][phase]))%2;visibleGaugePosition=Math.min(1,Math.max(0,pos<=1?pos:2-pos));needle.style.left=(visibleGaugePosition*100)+'%'}if(mode==='kick'&&now-shotStart>=760){mode='flight';flightStart=now}if(mode==='flight'&&now-flightStart>=4800)finish();draw(now);raf=requestAnimationFrame(tick)}let stadiumPreview=false;function reset(){stadiumPreview=false;mode='meter';phase=0;values=[];pos=0;visibleGaugePosition=0;last=0;result.style.display='none';document.getElementById('controls').style.display='block';tap.disabled=false;tap.style.display='inline-block';bar.style.display='block';label.textContent='① 威力を決める';syncGauge();hint.textContent=''}// The scored position is the exact position last painted on the gauge.
let visibleGaugePosition=0;
const gaugeBackgrounds=[
 'linear-gradient(90deg,#ed5360 0%,#9960a7 48%,#1257c5 83%,#0645b9 100%)',
 'linear-gradient(90deg,#ed5360 0%,#ac5b98 25%,#0645b9 50%,#ac5b98 75%,#ed5360 100%)',
 'linear-gradient(90deg,#0645b9 0%,#1257c5 17%,#9960a7 52%,#ed5360 100%)'
];
function syncGauge(){bar.style.background=gaugeBackgrounds[phase];bar.setAttribute('aria-label',['威力：右が最高点','ミート：中央が最高点','精度：左が最高点'][phase]);}
function commitGauge(){
 if(mode!=='meter')return;
 const p=visibleGaugePosition;
 // Play order: Power (right), Contact (center), Accuracy (left). Score the displayed needle position.
 const targets=[1,.5,0];
 const miss=Math.min(1,Math.abs(p-targets[phase])/(phase===1?.5:1));
 // Smooth score curve: a small miss is forgiving, and even the worst position earns 12 points.
 // Stadium (<18 weighted points) remains possible only with three near-total misses.
 const value=Math.round(12+88*Math.pow(1-miss,0.72));
 values.push(value);phase++;
 if(phase===3){flightDistance=determine();landing=destination(flightDistance);mode='kick';shotStart=performance.now();label.textContent='シュート！';tap.disabled=true;tap.style.display='none';bar.style.display='none'}
 else {pos=0;visibleGaugePosition=0;needle.style.left='0%';label.textContent=['① 威力を決める','② ミートを決める','③ 精度を決める'][phase];syncGauge();hint.textContent=''}
}
tap.addEventListener('click',commitGauge);
document.getElementById('restart').addEventListener('click',reset);reset();raf=requestAnimationFrame(tick);document.addEventListener('visibilitychange',()=>{last=0;if(document.hidden&&mode==='flight')flightStart=performance.now()-2000})})();
</script></html>
